# ABW requirement register.
#
# Every requirement the core must satisfy has one entry. `cargo xtask trace` links each
# entry to the tests tagged `// @req <ID>` and fails if any requirement due at or before
# the current milestone lacks a passing test. Protected by CODEOWNERS. Changing a
# requirement's text or milestone needs an ADR in docs/decisions/.
#
# Fields: id, title, text, source, milestone (M0..M6), optional note.

[meta]
current = "M0"
milestones = ["M0", "M1", "M2", "M3", "M4", "M5", "M6"]

# ---------------------------------------------------------------- governance (the harness)

[[req]]
id = "GOV-01"
title = "Trace blocks on missing evidence"
text = "cargo xtask trace fails when a requirement due at or before the current milestone has no linked test, or any linked test fails or is ignored."
source = "PLAN.md §4"
milestone = "M0"

[[req]]
id = "GOV-02"
title = "Tags must name real requirements"
text = "A test tagged with an ID that is not in the register fails trace."
source = "PLAN.md §4"
milestone = "M0"

[[req]]
id = "GOV-03"
title = "Register is well-formed"
text = "Register IDs are unique, every milestone is a declared milestone, and every entry has a title, text and source."
source = "PLAN.md §4"
milestone = "M0"

[[req]]
id = "GOV-04"
title = "Tests and product code change in separate PRs"
text = "A PR that changes verification assets (tests/, crates/*/tests/, docs/requirements/, xtask/) may not change product code, except that a product PR may delete `#[ignore = \"pending ...\"]` lines from tests it makes pass."
source = "PLAN.md §8"
milestone = "M0"

[[req]]
id = "GOV-05"
title = "A pending test is not evidence"
text = "A test marked #[ignore] never counts as passing, so a requirement whose only tests are pending is unmet."
source = "PLAN.md §8"
milestone = "M0"

# ---------------------------------------------------------------- target design invariants (§1.2)

[[req]]
id = "T1"
title = "The write boundary is a crate"
text = "abw-ledger is the only code that holds a write-capable database handle. Handlers receive ReadDb, a read-only handle. A handler that writes directly does not compile."
source = "target-system-design §1.2, §3.9"
milestone = "M1"

[[req]]
id = "T2"
title = "Trust history is events"
text = "Each stream has gap-free sequence numbers and is appended with expected-version compare-and-swap. Envelopes are typed and versioned (event_type, schema_version). Artifacts are content-addressed."
source = "target-system-design §1.2, §3.2"
milestone = "M1"

[[req]]
id = "T3"
title = "Projections update in the append transaction"
text = "A projection row changes only in a transaction that appends the event justifying it, enforced by the database. Rebuilding a projection from events reproduces it exactly."
source = "target-system-design §1.2, §3.4"
milestone = "M1"

[[req]]
id = "T4"
title = "One canonical form, one hash format"
text = "Canonical JSON is RFC 8785 (JCS). Every hash is sha256:<64 lowercase hex> over the canonical bytes."
source = "target-system-design §1.2, §3.6"
milestone = "M1"

[[req]]
id = "T5"
title = "A record is atomic with its effect"
text = "Every decision, charge, version and verdict commits in the same transaction as the effect it describes. No write-behind, detached task or fire-and-forget for these records."
source = "target-system-design §1.2"
milestone = "M1"

[[req]]
id = "T6"
title = "The database enforces immutability"
text = "Events, artifacts, provenance, policy versions and immutable projections reject UPDATE, DELETE and TRUNCATE by trigger; foreign keys into them are ON DELETE RESTRICT; the app role has INSERT only on event and artifact tables."
source = "target-system-design §1.2, §3.1.1"
milestone = "M1"

[[req]]
id = "T7"
title = "A control refuses or it does not exist"
text = "A check named gate, contract, binding or validation blocks the effect it guards. A check that only records is typed Observation and records Undetermined with a reason_class, never Refused or Approved."
source = "target-system-design §1.2, §8"
milestone = "M3"

[[req]]
id = "T8"
title = "Evidence is separate from verdict"
text = "Evidence collection and verdict computation live in different modules; no function both stamps provenance and amends a claim; the crate graph enforces it."
source = "target-system-design §1.2, §7.1"
milestone = "M3"

[[req]]
id = "T9"
title = "Money is a ledger (superseded)"
text = "Superseded by ECO-1..ECO-9 (economy.md). Kept so the trace shows the replacement explicitly."
source = "target-system-design §1.2; economy.md"
milestone = "M2"
note = "Satisfied when ECO-1..7 pass; the tests for those IDs also carry this tag."

[[req]]
id = "T10"
title = "Interpretive is never provenance"
text = "LLM-judge output is typed interpretive. The database makes it unreachable in any Grounding walk and unusable as a source."
source = "target-system-design §1.2, §6.2"
milestone = "M3"

[[req]]
id = "T11"
title = "Verdicts are reproducible"
text = "A verdict vector is a pure function of (claim, artifacts, stream heads, provenance graph, theta version); theta_version is part of the vector; replay reproduces it bit for bit."
source = "target-system-design §1.2, §5.6"
milestone = "M3"

[[req]]
id = "T12"
title = "The verdict vocabulary is closed"
text = "Every dimension returns exactly one of pass, fail, unsupported, not_evaluated. A missing substrate never yields pass."
source = "target-system-design §1.2, §5.4"
milestone = "M3"

[[req]]
id = "T13"
title = "Lattice, not ladder"
text = "All five dimensions are evaluated every time without short-circuit; dependencies are declared in one table; one lattice.evaluated event carries the whole vector."
source = "target-system-design §1.2, §5.3"
milestone = "M3"

[[req]]
id = "T14"
title = "A failure is a diagnosis, never terminal"
text = "Every non-pass carries failure class, evidence reference, expected, observed, suggested action and remaining budget. The worst outcome is Parked with owner notification."
source = "target-system-design §1.2"
milestone = "M3"

[[req]]
id = "T15"
title = "Evidence, not verdict, at the routing boundary"
text = "The lattice outputs a vector; a separately versioned routing policy picks the action; the judge report and vector reach route() as separate typed inputs; the judge cannot raise any dimension."
source = "target-system-design §1.2, §5.9-5.10"
milestone = "M3"

[[req]]
id = "T16"
title = "One word, one meaning"
text = "Presence, Liveness, Truth, Grounding and Binding name only Lattice dimensions."
source = "target-system-design §1.2"
milestone = "M1"

[[req]]
id = "T17"
title = "Tenancy on every read by ID"
text = "Reading an object by opaque ID returns 404 unless the caller is authorised for that object."
source = "target-system-design §1.2, §13.1"
milestone = "M2"

[[req]]
id = "T18"
title = "No user-supplied URL reaches a private address"
text = "Every outbound request to a tenant-supplied host goes through one guard that resolves the host, classifies the address, pins the IP and refuses redirects."
source = "target-system-design §1.2, §12.5"
milestone = "M2"

[[req]]
id = "T19"
title = "Binding is registration, scored at outcome"
text = "A claim becomes scoreable when commitment.bound exists; its Brier score is computed from that claim's own p when outcome.observed is appended."
source = "target-system-design §1.2, §5.12"
milestone = "M3"

[[req]]
id = "T20"
title = "The outer loop proposes; a human accepts"
text = "No theta or routing policy changes without a human-accepted policy.adjusted event; a proposal that breaches the human-load ceiling is rejected."
source = "target-system-design §1.2, §11.4"
milestone = "M3"

# ---------------------------------------------------------------- economy (economy.md)

[[req]]
id = "ECO-1"
title = "Allowance changes only through its own events"
text = "An allowance changes only through events on its allowance:<owner> stream; available = funded + granted - consumed - held is a projection the database will not change without an event."
source = "economy.md"
milestone = "M2"

[[req]]
id = "ECO-2"
title = "Funding requires a settled ACN commitment"
text = "allowance.funded requires a settled ACN commitment reference verified by abw-acn and is idempotent on that reference."
source = "economy.md"
milestone = "M4"

[[req]]
id = "ECO-3"
title = "Grants are operator-only and capped"
text = "allowance.granted requires the operator actor and is capped per owner by policy."
source = "economy.md"
milestone = "M2"

[[req]]
id = "ECO-4"
title = "No value moves between owners inside ABW"
text = "No event type moves allowance between owners; a consumption event must cite an episode owned by the stream's owner."
source = "economy.md"
milestone = "M2"

[[req]]
id = "ECO-5"
title = "Hold before work, settle at close, no debt"
text = "A hold is placed before work and is a hard ceiling; settlement and release commit in the episode-close transaction; actual use never exceeds the hold."
source = "economy.md"
milestone = "M2"

[[req]]
id = "ECO-6"
title = "Idempotent allowance events"
text = "Every allowance event carries an idempotency key; a retry never funds or charges twice."
source = "economy.md"
milestone = "M2"

[[req]]
id = "ECO-7"
title = "Non-negative available and held"
text = "available >= 0 and held >= 0 are enforced by the database."
source = "economy.md"
milestone = "M2"

[[req]]
id = "ECO-8"
title = "Value between owners only through ACN"
text = "Selling, renting and licensing between owners happen only through ACN commitments; only allowlisted event types leave through the outbox; the requester declares satisfaction."
source = "economy.md"
milestone = "M4"

[[req]]
id = "ECO-9"
title = "ACN isolation and key hygiene"
text = "Only abw-acn depends on Nostr, Cashu or key-store crates; no private key material appears in DB columns, logs or error strings."
source = "economy.md"
milestone = "M4"

# ---------------------------------------------------------------- protected capabilities (PLAN.md §9)

[[req]]
id = "PROT-01"
title = "cohere_and_coordinate is carried over in full"
text = "TEC coherence (Gamma), destructive/productive conflict classification, cascade of coordination observations into members' memory (strategist-only, current members only), the coordination brief, and the valence-homophily guard computed in code, not prompt text."
source = "PLAN.md §9; harvest/agents.md"
milestone = "M5"

[[req]]
id = "PROT-02"
title = "Strategists are agents that actually orchestrate"
text = "Pipeline, MoE routing, debate and vote strategists each have orchestration implemented in code with an acceptance test; behaviours that were prompt-only in legacy (harvest/agents.md) are implemented or explicitly dropped by ADR."
source = "PLAN.md §9; harvest/agents.md"
milestone = "M5"
note = "MoE routing (calibration-first selection, routing decisions recorded) is due in M3 for Fermi; tracked by CAP-04.01."

[[req]]
id = "PROT-03"
title = "Exact Shapley credit with its validity gates"
text = "Per-agent credit is exact Shapley over counterfactual re-runs of the team forecast, with the efficiency-residual and reconstruction-error gates; the team Brier is never copied to agents."
source = "PLAN.md §9; capabilities.md 'Open: where the halves meet'"
milestone = "M3"

[[req]]
id = "PROT-04"
title = "FPL, Monte Carlo and Sobol are certified kernels"
text = "The FPL parser and interpreter, Monte Carlo executor and Sobol sensitivity are pure crates certified against independent oracles (analytic cases, Ishigami/g-function, seeded bit-identical replay)."
source = "PLAN.md §9; harvest/modules.md"
milestone = "M3"

[[req]]
id = "PROT-05"
title = "BayesOps is a certified kernel"
text = "Posterior fitting is a pure crate certified on conjugate cases with analytic posteriors and posterior predictive checks; Loop 5.B's Monte Carlo impact gate auto-accepts or holds for human review."
source = "PLAN.md §9"
milestone = "M3"

[[req]]
id = "PROT-06"
title = "The five feedback loops run with gates that fire"
text = "Loops 1, 2, 3.A/B, 4.A/B and 5.A/B each have a gate shown to fire, admit valid input, and reject input that satisfies a proxy but not the property."
source = "PLAN.md §9; feedback-loops.md"
milestone = "M5"

[[req]]
id = "PROT-07"
title = "Memory and consolidation are carried over"
text = "Per-agent episodic and semantic memory with source-quality tags, and consolidation of verdict-qualified episodes only."
source = "PLAN.md §9"
milestone = "M5"

[[req]]
id = "PROT-08"
title = "Evaluators are carried over"
text = "Pluggable evaluators (Sotopia, WildGuard, faithfulness and the others in harvest/modules.md) record signals graded LLM-judged or hard-verified."
source = "PLAN.md §9"
milestone = "M5"

[[req]]
id = "PROT-09"
title = "Curated agent cards are carried over as data"
text = "Every curated card with disposition port or port:tenant-* in harvest/agents.md is importable as a versioned agent; dropped cards are listed in an ADR."
source = "PLAN.md §9; harvest/agents.md"
milestone = "M2"

[[req]]
id = "PROT-10"
title = "Calibration and Brier per agent and team"
text = "Calibration is measured against external ground truth per team and per agent (via Shapley), separately from fidelity."
source = "PLAN.md §9; capabilities.md §6, §13"
milestone = "M3"

[[req]]
id = "PROT-11"
title = "Dynamics and SimOps models are carried over"
text = "Dynamics, rheology and cascade models are pure crates with oracle tests; SimOps projections are derivation events."
source = "PLAN.md §9"
milestone = "M6"

[[req]]
id = "PROT-12"
title = "DPP and carbon accounting are carried over"
text = "Carbon calculations are kernels; passports are published by one command in one transaction with lineage to episodes, source commit and artifact hashes, and are signed."
source = "PLAN.md §9; target-system-design §10.2"
milestone = "M6"

