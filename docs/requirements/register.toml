id = "CAP-11.02"
title = "Gate effects: Mark undetermined"
text = "When a check cannot run, treat it as not approved, with a reason"
source = "capabilities.md §11"
milestone = "M3"

[[req]]
id = "CAP-11.03"
title = "Gate effects: Record an observation"
text = "A check that only watches is labelled as such and never blocks or approves"
source = "capabilities.md §11"
milestone = "M3"

[[req]]
id = "CAP-12.01"
title = "Account for money: Hold credit"
text = "Reserve funds before work starts"
source = "capabilities.md §12"
milestone = "M2"
note = "Superseded in mechanism by economy.md (allowance, no wallets); the requirement stands as restated there."

[[req]]
id = "CAP-12.02"
title = "Account for money: Settle a run"
text = "Charge actual cost and release the rest when the episode closes"
source = "capabilities.md §12"
milestone = "M2"
note = "Superseded in mechanism by economy.md (allowance, no wallets); the requirement stands as restated there."

[[req]]
id = "CAP-12.03"
title = "Account for money: Grant, deposit, transfer"
text = "Move credit with balanced double entries; retries never double-charge"
source = "capabilities.md §12"
milestone = "M2"
note = "Superseded in mechanism by economy.md (allowance, no wallets); the requirement stands as restated there."

[[req]]
id = "CAP-12.04"
title = "Account for money: Fund a spawn"
text = "Pay for, or sponsor, a new app workspace"
source = "capabilities.md §12"
milestone = "M2"
note = "Superseded in mechanism by economy.md (allowance, no wallets); the requirement stands as restated there."

[[req]]
id = "CAP-13.01"
title = "Score fidelity: Observe an outcome"
text = "Record what happened against each bound commitment"
source = "capabilities.md §13"
milestone = "M3"

[[req]]
id = "CAP-13.02"
title = "Score fidelity: Score fidelity"
text = "Update how reliably each agent, endorser and judge fulfils contracts (Beta posterior over validated claims)"
source = "capabilities.md §13"
milestone = "M3"

[[req]]
id = "CAP-13.03"
title = "Score fidelity: Detect false passes"
text = "Flag dimensions that passed a claim that later proved wrong, or that a human declined"
source = "capabilities.md §13"
milestone = "M3"

[[req]]
id = "CAP-13.04"
title = "Score fidelity: Detect false fails"
text = "Flag dimensions that failed a claim a human then endorsed"
source = "capabilities.md §13"
milestone = "M3"

[[req]]
id = "CAP-13.05"
title = "Score fidelity: Propose a policy change"
text = "Suggest new thresholds or routes, tested against 30 days of past claims"
source = "capabilities.md §13"
milestone = "M5"

[[req]]
id = "CAP-13.06"
title = "Score fidelity: Accept a policy change"
text = "Only a human can make a proposal active"
source = "capabilities.md §13"
milestone = "M3"

[[req]]
id = "CAP-14.01"
title = "Connect and protect: Serve tools"
text = "Expose published tools over MCP, each call metered and recorded as an episode"
source = "capabilities.md §14"
milestone = "M6"

[[req]]
id = "CAP-14.02"
title = "Connect and protect: Accept tasks"
text = "Take A2A tasks, report state, deliver signed webhooks reliably"
source = "capabilities.md §14"
milestone = "M6"

[[req]]
id = "CAP-14.03"
title = "Connect and protect: Publish an artifact"
text = "Release a verified result (e.g. a DPP) with its full trace"
source = "capabilities.md §14"
milestone = "M6"

[[req]]
id = "CAP-14.04"
title = "Connect and protect: Isolate tenants"
text = "Reading any object by ID returns \"not found\" unless the caller may see it"
source = "capabilities.md §14"
milestone = "M2"

[[req]]
id = "CAP-14.05"
title = "Connect and protect: Guard outbound calls"
text = "Never let a tenant-supplied URL reach a private address"
source = "capabilities.md §14"
milestone = "M2"

[[req]]
id = "CAP-14.06"
title = "Connect and protect: Keep secrets"
text = "Encrypt credentials and signing keys at rest"
source = "capabilities.md §14"
milestone = "M2"

[[req]]
id = "CAP-15.01"
title = "Build and ship apps: Register an app"
text = "Submit a manifest tying a canonical document schema, a fleet, a workspace template and a UI; store manifest and template as artifacts so later edits never change existing workspaces"
source = "capabilities.md §15"
milestone = "M3"

[[req]]
id = "CAP-15.02"
title = "Build and ship apps: Define the canonical document"
text = "Publish a JSON Schema so UIs can validate it and agents know what shape to produce"
source = "capabilities.md §15"
milestone = "M3"

[[req]]
id = "CAP-15.03"
title = "Build and ship apps: Assemble a fleet"
text = "Reuse bestiary agents, fork variants or author new ones; register the fleet as a reusable composition"
source = "capabilities.md §15"
milestone = "M6"

[[req]]
id = "CAP-15.04"
title = "Build and ship apps: Spawn a workspace"
text = "Provision a runtime from the template: budget, auto-hired agents, initial files"
source = "capabilities.md §15"
milestone = "M3"

[[req]]
id = "CAP-15.05"
title = "Build and ship apps: Read and write state"
text = "The UI reads and writes the canonical document in the workspace"
source = "capabilities.md §15"
milestone = "M3"

[[req]]
id = "CAP-15.06"
title = "Build and ship apps: Invoke agents"
text = "Message an agent in the workspace (charges its budget) or execute one directly (charges the user's wallet)"
source = "capabilities.md §15"
milestone = "M3"

[[req]]
id = "CAP-15.07"
title = "Build and ship apps: Set visibility"
text = "Private, unlisted (anyone with the slug) or public (listed)"
source = "capabilities.md §15"
milestone = "M6"

[[req]]
id = "CAP-15.08"
title = "Build and ship apps: Share a workspace"
text = "Let colleagues work in the same workspace"
source = "capabilities.md §15"
milestone = "M6"

[[req]]
id = "CAP-15.09"
title = "Build and ship apps: Be discovered"
text = "Xaman Ek describes the app from its manifest's description and tagline"
source = "capabilities.md §15"
milestone = "M6"

[[req]]
id = "CAP-15.10"
title = "Build and ship apps: Price an app"
text = "Metered or subscription pricing with a revenue share; reserved, inert until revenue accounting ships"
source = "capabilities.md §15"
milestone = "M6"
