[package]
name = "abw-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Agent cards, the episode executor, tools, LLM providers and the egress guard (target-system-design §4, §12.5; ADR-0008 §5-§8)"

[features]
# ADR-0008 §5: the pipeline fault hooks for the T5 tests. Never enabled outside tests.
fault-injection = ["abw-ledger/fault-injection"]

[dependencies]
abw-canon = { path = "../abw-canon" }
abw-ledger = { path = "../abw-ledger" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# T18: used only by `egress` (cargo xtask check, rule `egress`). TLS through rustls, so
# the build needs no system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
abw-agent = { path = ".", features = ["fault-injection"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json", "uuid", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
