[workspace]
resolver = "3"
members = [
    "crates/abw-agent",
    "crates/abw-canon",
    "crates/abw-http",
    "crates/abw-ledger",
    "crates/abw-ledger-macros",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
let_underscore_must_use = "deny"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"
